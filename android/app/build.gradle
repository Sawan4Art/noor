import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

/**
 * مصدر واحد للحقيقة: النسخة والكود تيجي من package.json في جذر الريفو.
 * مثال: 0.1.0 → versionCode 100 | 1.2.3 → 10203
 */
def packageJson = new JsonSlurper().parseText(file('../../package.json').text)
def appVersionName = (packageJson.version ?: '1.0.0').toString()
def versionParts = appVersionName.tokenize('.').collect { (it =~ /\d+/)[0].toInteger() }
def appVersionCode = (versionParts[0] ?: 0) * 10000 + (versionParts[1] ?: 0) * 100 + (versionParts[2] ?: 0)

/**
 * توقيع الإصدار من متغيرات البيئة أولاً (CI)، وبعدها من ملف .env المحلي تلقائياً.
 * ممنوع أي سر داخل الريفو (قاعدة الميثاق) — .env متجاهَل في جيت والبيانات عنده بس.
 * لو مفيش توقيع خالص: بناء متابِع بتوقيع debug مع تحذير واضح (fallback).
 */
def loadDotEnv = {
    def envFile = rootProject.file('../.env')
    def map = [:]
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
                def idx = trimmed.indexOf('=')
                map[trimmed.substring(0, idx).trim()] = trimmed.substring(idx + 1).trim().replaceAll(/^["']|["']$/, '')
            }
        }
    }
    return map
}
def dotenv = loadDotEnv()

def releaseKeystorePath = System.getenv('CAP_KEYSTORE_PATH') ?: dotenv['CAP_KEYSTORE_PATH'] ?: ''
def releaseKeystorePassword = System.getenv('CAP_KEYSTORE_PASSWORD') ?: dotenv['CAP_KEYSTORE_PASSWORD'] ?: ''
def releaseKeyAlias = System.getenv('CAP_KEY_ALIAS') ?: dotenv['CAP_KEY_ALIAS'] ?: ''
def releaseKeyPassword = System.getenv('CAP_KEY_PASSWORD') ?: dotenv['CAP_KEY_PASSWORD'] ?: ''
def hasReleaseSigning = releaseKeystorePath && file(releaseKeystorePath).exists()

android {
    namespace = "com.sawan4art.noor"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sawan4art.noor"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                // Fallback: توقيع debug علشان البناء ما يكسرش — مع تحذير
                logger.warn('⚠ مفتاح توقيع الإصدار غير موجود في متغيرات البيئة — سيستخدم توقيع debug')
                signingConfig signingConfigs.debug
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
