name: بناء وإصدار APK — نور المسلم (كوتلن أصلي)

# إعادة البناء الكاملة بلغة كوتلن + Jetpack Compose — لا ويب ولا كاباسيتور
# عند دفع وسم v*: اختبارات + بناء + توقيع + Release (ألفا = pre-release)
# عند دفع main: اختبارات + بناء فحص فقط (بلا إصدار)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: اختبارات وبناء APK موقّع
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تجهيز JDK 21 (مع كاش Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: استرجاع مفتاح التوقيع من الأسرار
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $HOME/noor-release.keystore
          echo "NOOR_KEYSTORE=$HOME/noor-release.keystore" >> $GITHUB_ENV
          echo "NOOR_KS_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "NOOR_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "NOOR_KS_PASS=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      # اختبارات الوحدة — الاختبار الذهبي يفشل البناء عند أي انحراف في المواقيت
      - name: اختبارات الوحدة (الذهبية)
        run: ./gradlew :app:testReleaseUnitTest --console=plain --stacktrace

      - name: بناء نسخة ألفا
        run: ./gradlew :app:assembleAlpha --console=plain --stacktrace

      # الإصدار الرسمي الموحّد عند الوسم النهائي (بلا لاحقة ألفا)
      - name: بناء نسخة release عند الوسم
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'alpha')
        run: ./gradlew :app:assembleRelease --console=plain --stacktrace

      - name: التحقق من التوقيع
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "${{ github.ref_name }}" == *alpha* ]]; then
            APK_PATH="app/build/outputs/apk/alpha/app-alpha.apk"
          else
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          fi
          echo "الملف: $APK_PATH"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK_PATH" | head -4
          echo "NOOR_APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: تسمية ملف الإصدار
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp "${NOOR_APK_PATH}" "noor-almuslim-${{ github.ref_name }}.apk"
          echo "NOOR_APK_NAME=noor-almuslim-${{ github.ref_name }}.apk" >> $GITHUB_ENV

      # نص الإصدار يُولّد من سجل النسخ — التطبيق نفسه يقرأ هذا القسم في «ما الجديد»
      - name: توليد نص الإصدار من سجل النسخ
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release_body.py "${{ github.ref_name }}" > release_body.md

      # ألفا = pre-release حتى لا يلتقطها بنر التحديث في النسخة المستقرة
      - name: إنشاء GitHub Release ورفع الـ APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: نور المسلم ${{ github.ref_name }}
          files: ${{ env.NOOR_APK_NAME }}
          prerelease: ${{ contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          body_path: release_body.md
      - name: ملخص
        run: |
          echo "### ✅ بناء نور المسلم الكوتلني نجح" >> $GITHUB_STEP_SUMMARY
          du -h app/build/outputs/apk/alpha/app-alpha.apk
