name: بناء وإصدار APK — نور المسلم (كوتلن أصلي)

# إعادة البناء الكاملة بلغة كوتلن + Jetpack Compose — لا ويب ولا كاباسيتور
# عند دفع وسم v*: اختبارات + بناء + توقيع + Release (ألفا = pre-release)
# عند دفع main: اختبارات + بناء فحص فقط (بلا إصدار)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: اختبارات وبناء APK موقّع
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تجهيز JDK 21 (مع كاش Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      # درس alpha59: توزيعة غرادل تُنزَّل من services.gradle.org وقد
      # ترد 504 — فتجهيزٌ بإعادة المحاولة قبل أي خطوة بناء
      - name: تجهيز غرادل بإعادة المحاولة
        run: |
          for i in 1 2 3 4 5 6; do
            if ./gradlew --version >/dev/null 2>&1; then
              echo "غرادل جاهز (المحاولة $i)"
              exit 0
            fi
            echo "المحاولة $i — مصدر التوزيعة مشغول، انتظار ٢٥ ثانية…"
            sleep 25
          done
          echo "تعذّر تجهيز غرادل بعد المحاولات كلها"
          exit 1

      - name: استرجاع مفتاح التوقيع من الأسرار
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $HOME/noor-release.keystore
          echo "NOOR_KEYSTORE=$HOME/noor-release.keystore" >> $GITHUB_ENV
          echo "NOOR_KS_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "NOOR_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "NOOR_KS_PASS=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      # اختبارات الوحدة — الاختبار الذهبي يفشل البناء عند أي انحراف في المواقيت
      # ودروب GitHub الحالي (504) قد يقطع تنزيل اعتمادية — إعادة المحاولة تنقذ
      # فالكاش يتقدم كل محاولة
      - name: اختبارات الوحدة (الذهبية)
        run: |
          for i in 1 2 3 4 5; do
            if ./gradlew :app:testReleaseUnitTest --console=plain --stacktrace; then exit 0; fi
            echo "المحاولة $i فشلت — انتظار ٣٠ ثانية قبل الإعادة…"
            sleep 30
          done
          exit 1

      - name: بناء نسخة ألفا
        run: |
          for i in 1 2 3 4 5; do
            if ./gradlew :app:assembleAlpha --console=plain --stacktrace; then exit 0; fi
            echo "المحاولة $i فشلت — انتظار ٣٠ ثانية قبل الإعادة…"
            sleep 30
          done
          exit 1

      # من 1.70 (بلاغ المالك 2026-11-11: إزالة كلمة ألفا) كل إصدارٍ
      # يُبنى بالنكهتين: المستقرة (com.sawan4art.noor) ونسخة ألفا
      # (com.sawan4art.noor.alpha — نسخة الجهاز المعتمدة) — والفاحصُ
      # في التطبيق يختار أصل نكهته من الأصول
      - name: بناء النسختين release وalpha عند الوسم
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for i in 1 2 3 4 5; do
            if ./gradlew :app:assembleRelease :app:assembleAlpha --console=plain --stacktrace; then exit 0; fi
            echo "المحاولة $i فشلت — انتظار ٣٠ ثانية قبل الإعادة…"
            sleep 30
          done
          exit 1

      - name: التحقق من التوقيع (النسختان)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "== نسخة release =="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | head -4
          echo "== نسخة alpha =="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/alpha/app-alpha.apk | head -4

      - name: تسمية ملفات الإصدار
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/release/app-release.apk "noor-almuslim-${{ github.ref_name }}.apk"
          cp app/build/outputs/apk/alpha/app-alpha.apk "noor-almuslim-${{ github.ref_name }}-alpha.apk"
          echo "NOOR_APKS=noor-almuslim-${{ github.ref_name }}.apk noor-almuslim-${{ github.ref_name }}-alpha.apk" >> $GITHUB_ENV

      # نص الإصدار يُولّد من سجل النسخ — التطبيق نفسه يقرأ هذا القسم في «ما الجديد»
      - name: توليد نص الإصدار من سجل النسخ
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release_body.py "${{ github.ref_name }}" > release_body.md

      # من 1.70: كل إصدارٍ كامل (بلا ألفا في الاسم) — والفاحص في
      # التطبيق يختار ملف نكهته من الأصول المرفقة
      - name: إنشاء GitHub Release ورفع الـ APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: نور المسلم ${{ github.ref_name }}
          files: ${{ env.NOOR_APKS }}
          prerelease: false
          generate_release_notes: true
          body_path: release_body.md
      - name: ملخص
        run: |
          echo "### ✅ بناء نور المسلم الكوتلني نجح" >> $GITHUB_STEP_SUMMARY
          du -h app/build/outputs/apk/alpha/app-alpha.apk
